services:
  - type: web
    name: saathi
    runtime: node
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        value: saathi2024
        sync: false
      # Persistence: set these to use Supabase (Postgres). Run
      # server/supabase/schema.sql once in the Supabase SQL editor first.
      # SUPABASE_SERVICE_KEY is the service-role key — server side only.
      - key: SUPABASE_URL
        value: ""
        sync: false
      - key: SUPABASE_SERVICE_KEY
        value: ""
        sync: false
      - key: MONGODB_URI
        value: ""
        sync: false
      - key: CORS_ORIGIN
        value: "*"